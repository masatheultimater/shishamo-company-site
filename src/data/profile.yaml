# 原点と哲学
story:
  title: 中小企業を支援したい理由
  subtitle: 私の原点
  grandfatherWords: みんなを助ける人になりなさい
  content: |
    祖父からいつも言われていた言葉です。

    祖父は、小さな印刷会社を営んでいました。
    地域の商店や企業のチラシ、名刺、パンフレット。
    祖父は一つひとつ丁寧に仕事をし、お客様に喜ばれていました。

    しかし、時代は変わりました。
    紙からデジタルへ。印刷物の需要は急速に減り、
    祖父の会社は廃業を余儀なくされました。

    当時の私には、何もできませんでした。
    ITの知識も、経営の知識も、財務の知識もなく、
    ただ見ているしかできなかった。

    あの時の無力感が、今の私の原動力です。

    「次は絶対に助ける」

    同じように時代の変化に直面している中小企業の社長さんがいたら、
    今度こそ、一緒に乗り越える力になりたい。
    ITも、経営も、財務も。必要なことは何でも学び、何でもやる。

    それが、祖父への約束であり、私がこの仕事をする理由です。

# 座右の銘
mottos:
  - text: 馬を水辺に連れて行くことはできても、水を飲ませることはできない
    meaning: 支援はできても、最後に行動するのは本人。だからこそ、本人が「やりたい」と思える環境づくりを大切にしています。

# 大切にしていること
philosophy:
  - title: 共感も否定もしない。まず聞く。
    content: 最初からアドバイスはしません。話をそのまま受け取り、整理し、本当の問題がどこにあるかを探ります。

  - title: 根拠で動く
    content: 「なんとなく良さそう」では進めません。数字と事実をもとに選択肢を出し、「確かに、それだ」と納得できる答えを見つけます。

  - title: 先生にならない
    content: 外から「こうすべき」と教えるのは性に合わない。同じ立場の人間として、一緒に走る。うまくいかなければ立ち止まって考え直す。それが自分のやり方です。

  - title: 壊れているものを放置しない
    content: システムの不具合、数字の乱れ、回っていない業務——「壊れている」と気づいたら直さずにいられない。祖父の会社を救えなかった経験が、この衝動の原点です。

# ブランドストーリー
brand:
  title: なぜ「ししゃも」？
  content: |
    大学の部活で先輩に「お前の足、ししゃもみたいだな」と言われたのが始まりです。
    そのまま定着して、気づけば本名より通りがよくなっていました。
    屋号にしたのは、士業らしい堅い名前をあえて避けたかったから。
    資格や肩書きは裏付けとして持っていますが、振りかざすつもりはありません。
    気軽に声をかけてもらえる存在でありたい——「ししゃも」にはそういう思いを込めています。

